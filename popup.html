<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <title>Smart Blur</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">

    <header class="top">
      <img class="logo" src="icon128.png" alt="" width="38" height="38">
      <div class="brand">
        <h1>Smart Blur</h1>
        <div class="meta">
          <span id="version"></span>
          <span class="sep" aria-hidden="true">·</span>
          <kbd id="shortcutKeys"></kbd>
          <span data-i18n="shortcutLabel"></span>
          <button type="button" class="link" id="shortcutChange" data-i18n="shortcutChange"></button>
        </div>
      </div>
      <label class="switch switch-lg">
        <input type="checkbox" id="globalEnabled" role="switch" data-i18n-aria="masterAria">
        <span class="track" aria-hidden="true"></span>
      </label>
    </header>

    <section class="site" id="siteCard" data-state="loading" aria-live="polite">
      <span class="site-dot" aria-hidden="true"></span>
      <div class="site-text">
        <p class="site-title" id="siteTitle">&nbsp;</p>
        <p class="site-hint" id="siteHint"></p>
      </div>
      <button type="button" class="btn" id="siteToggle" hidden></button>
    </section>

    <section class="card sliders" data-i18n-aria="sectionSpotlight">
      <div class="slider">
        <div class="slider-head">
          <label for="spotlightSize" data-i18n="spotlightSize"></label>
          <output id="spotlightSizeValue" for="spotlightSize"></output>
        </div>
        <input type="range" id="spotlightSize" data-key="spotlightSize">
      </div>

      <div class="slider">
        <div class="slider-head">
          <label for="blurStrength" data-i18n="blurStrength"></label>
          <output id="blurStrengthValue" for="blurStrength"></output>
        </div>
        <input type="range" id="blurStrength" data-key="blurStrength">
      </div>
    </section>

    <section class="card features" data-i18n-aria="sectionFeatures">

      <div class="row">
        <svg class="row-icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="3"/>
          <path d="M10 9.3v5.4l4.6-2.7z" fill="currentColor" stroke="none"/>
        </svg>
        <div class="row-text">
          <label class="row-title" for="keepVideosClear" data-i18n="videosTitle"></label>
          <span class="row-hint" data-i18n="videosHint"></span>
        </div>
        <label class="switch">
          <input type="checkbox" id="keepVideosClear" role="switch" data-key="keepVideosClear">
          <span class="track" aria-hidden="true"></span>
        </label>
      </div>

      <div class="row">
        <svg class="row-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 8.5V5.5A1.5 1.5 0 0 1 5.5 4h3M15.5 4h3A1.5 1.5 0 0 1 20 5.5v3M20 15.5v3a1.5 1.5 0 0 1-1.5 1.5h-3M8.5 20h-3A1.5 1.5 0 0 1 4 18.5v-3"/>
          <rect x="8.5" y="8.5" width="7" height="7" rx="1.5"/>
        </svg>
        <div class="row-text">
          <label class="row-title" for="articleFocus" data-i18n="focusTitle"></label>
          <span class="row-hint" data-i18n="focusHint"></span>
        </div>
        <label class="switch">
          <input type="checkbox" id="articleFocus" role="switch" data-key="articleFocus" aria-controls="focusHowto">
          <span class="track" aria-hidden="true"></span>
        </label>
      </div>

      <ol class="howto" id="focusHowto" hidden>
        <li><kbd data-i18n="focusKeyMove"></kbd><span data-i18n="focusStepMove"></span></li>
        <li><kbd data-i18n="focusKeyScroll"></kbd><span data-i18n="focusStepScroll"></span></li>
        <li><kbd data-i18n="focusKeyClick"></kbd><span data-i18n="focusStepClick"></span></li>
      </ol>

      <div class="row">
        <svg class="row-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5"/>
          <path d="M12 7.5V12l3 2"/>
        </svg>
        <div class="row-text">
          <span class="row-title" id="idleTitle" data-i18n="idleTitle"></span>
          <span class="row-hint" data-i18n="idleHint"></span>
        </div>
        <div class="segmented" id="idleTimeout" role="radiogroup" aria-labelledby="idleTitle"></div>
      </div>

      <div class="row">
        <svg class="row-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.5 3.5l17 17"/>
          <path d="M10.4 5.2A9.6 9.6 0 0 1 12 5c5 0 8.4 4.3 9.3 7a12.6 12.6 0 0 1-2.6 3.7M6.5 6.6A12.6 12.6 0 0 0 2.7 12c.9 2.7 4.3 7 9.3 7a9.7 9.7 0 0 0 5.4-1.6"/>
          <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
        </svg>
        <div class="row-text">
          <label class="row-title" for="panicEnabled" data-i18n="panicTitle"></label>
          <span class="row-hint" data-i18n="panicHint"></span>
        </div>
        <label class="switch">
          <input type="checkbox" id="panicEnabled" role="switch" data-key="panicEnabled">
          <span class="track" aria-hidden="true"></span>
        </label>
      </div>
    </section>

    <details class="card paused" id="pausedBox" hidden>
      <summary>
        <span data-i18n="pausedSites"></span>
        <span class="count" id="pausedCount"></span>
      </summary>
      <ul class="paused-list" id="pausedList"></ul>
    </details>

    <footer>
      <a class="author" href="https://ahmadalhalabi.com/" target="_blank" rel="noopener">
        <span data-i18n="footerMadeBy"></span>
        <span class="author-site">
          ahmadalhalabi.com
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>
        </span>
      </a>
    </footer>

  </main>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
